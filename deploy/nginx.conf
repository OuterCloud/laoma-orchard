# 老马苹果园 · Nginx 站点配置
#
# 用法（在服务器上）：
#   sudo cp nginx.conf /etc/nginx/conf.d/laoma-apples.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 这是一份纯静态配置：不需要 Node、不需要 PM2、不需要反向代理。
# Astro 构建产物（dist/）就是最终文件，直接由 Nginx 读取。

server {
    listen 80;
    listen [::]:80;

    server_name laoma-apples.site www.laoma-apples.site;

    # 站点根目录。部署脚本会把 dist/ 的内容同步到这里。
    root /var/www/laoma-apples;
    index index.html;

    # 不在响应头里暴露 Nginx 版本
    server_tokens off;

    charset utf-8;

    # ── 压缩 ──
    # 只压文本类。图片（webp/avif/jpg/png）本身已压缩，再 gzip 只会浪费 CPU。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # brotli 若已编译进 Nginx（多数发行版默认没有，有则更好）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 缓存策略 ──
    #
    # _astro/ 下 339 个文件全部带内容哈希（已校验，0 例外），
    # 内容变则文件名变，所以可以放心用不可变长期缓存。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 这几类文件名是固定的（favicon.svg / site.webmanifest），不带哈希，
    # 所以给较短的缓存时间，避免换了图标客户端还拿着旧的。
    location ~* ^/(favicon\.svg|site\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # og-cover.jpg 被微信/社交平台抓取，改版后要尽快生效
    location = /og-cover.jpg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # HTML 必须每次协商，否则上线新版本后用户还在看旧页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # ── 路由 ──
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Astro 构建出的 404 页（dist/404.html）
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # ── 安全响应头 ──
    # 站点是纯静态、无后端、无表单，所以策略可以收得很紧
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # 无需访问日志的静态资源已在上面的 location 里单独 access_log off
}


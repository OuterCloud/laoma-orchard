# 老马苹果园 · Nginx 站点配置
#
# ★ 适用场景：服务器上已经有别的服务在跑，不想影响它。
#
# 原理：Nginx 的「基于域名的虚拟主机」。多个 server 块可以监听同一个 80 端口，
# Nginx 靠请求头里的 Host（也就是用户输入的域名）分发到对应的站点。
# 所以本文件**不需要**改任何现有配置，也不会抢端口 —— 只要现有服务也是
# 由 Nginx 托管的（同样在 /etc/nginx/ 的 server 块里）。
#
# 前提检查（部署前务必确认）：
#   1. 现有服务是 Nginx 托管的：
#        sudo nginx -T | grep -n "server_name\|listen"
#      如果能看到别的 server_name，说明可以直接共存。
#   2. 如果 80 端口是被别的程序（Node/Java/Docker 等）直接占用的，
#      那 Nginx 起不来，需要先处理那个程序 —— 见文末说明。
#
# 用法：
#   sudo cp nginx.conf /etc/nginx/conf.d/laoma-apples.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 只有访问这两个域名的请求才会进到这里，
    # 访问别的域名仍由你原有的 server 块处理，互不干扰。
    server_name laoma-apples.site www.laoma-apples.site;

    # 站点根目录
    root /var/www/laoma-apples;
    index index.html;

    server_tokens off;
    charset utf-8;

    # ── 压缩 ──
    # 只压文本类。图片（webp/avif/jpg/png）本身已压缩，再 gzip 只浪费 CPU。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── 缓存策略 ──
    #
    # _astro/ 下 339 个文件全部带内容哈希（已校验，0 例外），
    # 内容变则文件名变，所以可以放心用不可变长期缓存。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 文件名固定、不带哈希，给较短缓存，避免换了图标客户端还用旧的
    location ~* ^/(favicon\.svg|site\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # og-cover.jpg 会被微信等平台抓取，改版后要尽快生效
    location = /og-cover.jpg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # HTML 每次协商，否则上线新版后用户还看旧页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # ── 路由 ──
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Astro 构建出的 404 页（dist/404.html）
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # ── 安全响应头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
}

# ── HTTPS ──
#
# 用 Let's Encrypt 免费证书。certbot --nginx 会读取上面的 server_name，
# 自动生成 443 的 server 块并加上 80→443 跳转，通常无需手工维护本节。
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d laoma-apples.site -d www.laoma-apples.site
#
# certbot 只会在本文件的 server 块内做改动，不会碰你原有的站点配置。
#
# ⚠️ 一个注意点：certbot 生成跳转时可能会加一条「所有 HTTP 都跳 HTTPS」的规则。
#    如果这会误伤你原有的站点，改用：
#      sudo certbot --nginx --redirect -d laoma-apples.site -d www.laoma-apples.site
#    然后在生成的 443 server 块里确认没有影响到别的 server_name。

# ─────────────────────────────────────────────────────────────
# 如果 80 端口不是 Nginx 托管的（被 Node/Java/Docker 等程序直接占用）
# ─────────────────────────────────────────────────────────────
#
# 先查清是谁占用：
#   sudo ss -lntp | grep ':80 '
#   sudo lsof -i :80
#
# 情况一：占用者是 Nginx 之外的某个程序
#   它和 Nginx 抢 80 端口，两者只能留一个。建议把这个程序改成由 Nginx 反向代理，
#   这样两个站点才能共存。改动较大，需要按具体情况处理。
#
# 情况二：暂时不想动现有服务
#   可以让本站点先跑在别的端口上（例如 8080）验证内容是否正常：
#     listen 8080;
#   此时访问 http://laoma-apples.site:8080 可看到网站。
#   但注意：Let's Encrypt 的 HTTP-01 校验与正式对外访问都依赖 80 端口，
#   所以这只能是临时验证手段，不能作为最终上线方案。

# LAOMA-ORCHARD-BEGIN
# ═══════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════
#
#  这是**两阶段部署的第一阶段**，只包含 80 端口的 server 块。
#  证书签发成功后，server-setup.sh 会用 nginx-laoma-https.conf 替换本文件，
#  那时才会加入 443 的 server 块。
#
#  为什么不一次写完：nginx 在**启动时**就要求 ssl_certificate 指向的文件存在。
#  先写 443 块会导致容器起不来（restart 循环），这正是第一版脚本失败的原因。
#
#  本文件末尾的结束标记由 deploy/patch_nginx.py 依赖，请勿删改。
# ═══════════════════════════════════════════════════════════════════════

server {
    # ⚠️ 这里**不能**加 default_server。
    # default_server 是「监听端口」的属性，不是 server_name 的属性：同端口下
    # 任何 Host 匹配不上 server_name 的请求，都会落到这个默认 server 上。
    # 我先前加了它，结果现有域名 mizunoamitiger.me 的 HTTP 请求也被接过来，
    # 命中了这里的 return 503，把别人正在用的站点搞坏了（已实测复现）。
    # 教训：不要声明别人端口的默认 server —— 那是「接管未定义域名」的语义，
    # 对一个与别人共用的端口而言越权了。
    #
    # 代价：没有默认 server 时，ACME 的 HTTP 校验请求会被现有配置里
    # server_name _ 的块接走并 301 掉，webroot 方式因此不可用。
    # 所以证书改用 standalone 模式申请（见 server-setup.sh 的说明）。
    listen 80;
    listen [::]:80;
    server_name laoma-apples.site www.laoma-apples.site;

    # Let's Encrypt 的 webroot 校验路径。
    # 目录由 deploy/merge_compose.py 生成的 compose 文件从宿主机挂载进来。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    # 尚未签发证书前，先返回一个明确的状态；证书就位后本块会被替换为 301 跳转
    location / {
        return 503;
    }
}
# ═══════════════════════════════════════════════════════════════════════
# LAOMA-ORCHARD-END

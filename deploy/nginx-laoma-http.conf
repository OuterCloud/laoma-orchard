# LAOMA-ORCHARD-BEGIN
# ═══════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════
#
#  这是**两阶段部署的第一阶段**，只包含 80 端口的 server 块。
#  证书签发成功后，server-setup.sh 会用 nginx-laoma-https.conf 替换本文件，
#  那时才会加入 443 的 server 块。
#
#  为什么不一次写完：nginx 在**启动时**就要求 ssl_certificate 指向的文件存在。
#  先写 443 块会导致容器起不来（restart 循环），这正是第一版脚本失败的原因。
#
#  本文件末尾的结束标记由 deploy/patch_nginx.py 依赖，请勿删改。
# ═══════════════════════════════════════════════════════════════════════

server {
    # default_server 是 listen 的**参数**，不能写成独立指令。
    # 加它的原因：现有配置里已有一个 `listen 80; server_name _;` 的块（只做 301
    # 跳转），它同样是 80 端口的候选默认 server。Nginx 选默认 server 时看的是
    # 配置文件里的出现顺序，而现有块排在我们前面，会把本域名的请求接走、
    # 导致 ACME 校验请求被 301 掉。
    # 声明 default_server 后由我们接管默认请求，再按 server_name 精确匹配分发；
    # 现有块的 server_name _ 仍能匹配其它域名，不受影响。
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name laoma-apples.site www.laoma-apples.site;

    # Let's Encrypt 的 webroot 校验路径。
    # 目录由 deploy/merge_compose.py 生成的 compose 文件从宿主机挂载进来。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    # 尚未签发证书前，先返回一个明确的状态；证书就位后本块会被替换为 301 跳转
    location / {
        return 503;
    }
}
# ═══════════════════════════════════════════════════════════════════════
# LAOMA-ORCHARD-END

# ═══════════════════════════════════════════════════════════════════════
#  老马苹果园 · 静态站点
# ═══════════════════════════════════════════════════════════════════════
#
#  这段配置放在文件最后（追加），因为 Nginx 对同名 listen 端口按出现顺序
#  match server_name：精确匹配优先。现有配置用的是 server_name _（通配），
#  所以只要本段用精确域名，就不会抢走现有站点的请求。
#
#  ⚠️ 不要修改本文件上方任何内容 —— 那是现有项目的配置。
#     重新执行 deploy/server-setup.sh 不会重复追加（有标记检测）。
#
#  静态文件来自宿主机目录的只读挂载，见 deploy/compose-laoma.yaml
# ═══════════════════════════════════════════════════════════════════════

# ── HTTP：只用于 ACME 证书校验，以及把普通访问跳到 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name laoma-apples.site www.laoma-apples.site;

    # Let's Encrypt 的 webroot 校验路径。
    # 这个目录由 deploy/compose-laoma.yaml 从宿主机挂载进来。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laoma-apples.site www.laoma-apples.site;

    # 证书由 certbot 签发后复制到宿主机的 nginx/ssl 目录（已挂载进容器）
    ssl_certificate     /etc/nginx/ssl/laoma-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/laoma-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/laoma-apples;
    index index.html;

    charset utf-8;

    # ── 压缩 ──
    # 只压文本。图片（webp/avif/jpg）本身已压缩，再 gzip 只浪费 CPU。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── 缓存 ──
    # _astro/ 下 339 个文件全部带内容哈希（已校验 0 例外），内容变则文件名变，
    # 因此可以放心用不可变长期缓存。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 文件名固定、不带哈希，短缓存，避免换图标后客户端还用旧的
    location ~* ^/(favicon\.svg|site\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # 会被微信等平台抓取，改版后要尽快生效
    location = /og-cover.jpg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # HTML 每次协商，否则上线新版后用户还看旧页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Astro 构建出的 404 页
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # ── 安全响应头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
}
# ── 老马苹果园配置结束 ──

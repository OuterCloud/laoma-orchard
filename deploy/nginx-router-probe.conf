# 临时诊断配置：直接问 nginx「哪个 server 块处理某个 Host」
#
# 目的：确定去掉我们块里的 default_server 之后，
#       laoma-apples.site 还能否被我们的块接住，
#       以及 mizunoamitiger.me 会不会回到原来的 301 行为。
#
# 用法（服务器上）：
#   sudo cp deploy/nginx-router-probe.conf /home/admin/mizuno-ami-tiger/nginx/router-probe.conf
#   sudo docker cp /home/admin/mizuno-ami-tiger/nginx/router-probe.conf \
#        mizuno-ami-tiger-nginx-1:/etc/nginx/conf.d/router-probe.conf
#   sudo docker exec mizuno-ami-tiger-nginx-1 nginx -t && \
#     sudo docker exec mizuno-ami-tiger-nginx-1 nginx -s reload
#
#   curl -s -D- -o /dev/null -H "Host: laoma-apples.site"  http://127.0.0.1/ | grep -i x-served-by
#   curl -s -D- -o /dev/null -H "Host: mizunoamitiger.me"  http://127.0.0.1/ | grep -i x-served-by
#   curl -s -D- -o /dev/null -H "Host: something-else.test" http://127.0.0.1/ | grep -i x-served-by
#
# 清理（务必执行）：
#   sudo docker exec mizuno-ami-tiger-nginx-1 rm -f /etc/nginx/conf.d/router-probe.conf
#   sudo docker exec mizuno-ami-tiger-nginx-1 nginx -s reload
#
# 这个文件放在 conf.d/ 里，它会在 http{} 内被 include，因此可以定义自己的 server 块。

# 用 TEST-NET-3 网段的回环端口，不占用 80/443，避免影响线上服务
server {
    listen 127.0.0.1:18080;
    server_name laoma-apples.site www.laoma-apples.site;
    add_header X-Served-By "PROBE:exact-match" always;
    return 200 "exact\n";
}

server {
    listen 127.0.0.1:18080;
    server_name _;
    add_header X-Served-By "PROBE:wildcard-fallback" always;
    return 200 "wildcard\n";
}

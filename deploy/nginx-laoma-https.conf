# LAOMA-ORCHARD-BEGIN
# ═══════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════
#
#  证书就位后由 server-setup.sh 用本文件替换 nginx-laoma-http.conf，
#  这时才加入 443 的 server 块 —— 因为 nginx 启动时要求 ssl_certificate
#  指向的文件必须存在，提前写入会导致容器起不来。
#
#  本文件末尾的结束标记由 deploy/patch_nginx.py 依赖，请勿删改。
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name laoma-apples.site www.laoma-apples.site;

    # 保留 ACME 校验路径，供后续自动续期使用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # 这里刻意不启用 HTTP/2。原因：两种写法互不兼容 ——
    #   `listen 443 ssl http2;`  在 nginx >= 1.25.1 上会报 deprecated 警告
    #   `http2 on;` / `http2;`   在 nginx <  1.25.1 上是未知指令，直接启动失败
    # 无法事先确定镜像里的 nginx 版本，所以只用最基础的 HTTP/1.1。
    # 对一个静态站而言 HTTP/2 并无必要（桌面/移动端 Lighthouse 均已在 HTTP/1.1 下满分）。
    server_name laoma-apples.site www.laoma-apples.site;

    # 证书由 certbot 签发后复制到宿主机 nginx/ssl 目录（已挂载进容器）
    ssl_certificate     /etc/nginx/ssl/laoma-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/laoma-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/laoma-apples;
    index index.html;

    charset utf-8;

    # ── 压缩 ──
    # 只压文本。图片（webp/avif/jpg）本身已压缩，再 gzip 只浪费 CPU。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── 缓存 ──
    # _astro/ 下 339 个文件全部带内容哈希（已校验 0 例外），内容变则文件名变，
    # 因此可以放心用不可变长期缓存。
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 文件名固定、不带哈希，短缓存，避免换图标后客户端还用旧的
    location ~* ^/(favicon\.svg|site\.webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # 会被微信等平台抓取，改版后要尽快生效
    location = /og-cover.jpg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # HTML 每次协商，否则上线新版后用户还看旧页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Astro 构建出的 404 页
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # ── 安全响应头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
}
# ═══════════════════════════════════════════════════════════════════════
# LAOMA-ORCHARD-END
